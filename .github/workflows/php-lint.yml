name: PHP Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          find . -name '*.php' -not -path './ITSM/PHPMailer/*' -not -path './ITSM/phpqrcode/*' -print0 \
            | xargs -0 -n1 php -l > lint.log 2>&1 || true
          grep -v '^No syntax errors' lint.log || true
          ! grep -q -E 'Parse error|Fatal error' lint.log
